<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
    <title>Tailwind CSS</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen ">
    <div class=" py-8 w-6/12 bg-white border rounded-md shadow-md flex justify-center">
        <form class="w-9/12"  action="">
            <h2 class="text-lg text-center font-bold">Create your Account</h2>
            <div class="my-2">
                <label for="fullname">Full Name</label>
                <input class="block w-full border-2 px-2 py-1 my-2 rounded-md focus:outline-none border-blue-200"  
                type="text" name="fullname" >
            </div>
            <div class="my-2"> 
                <label for="email">Email</label>
                <input class="block w-full border-2 px-2 py-1 my-2 rounded-md outline-none border-blue-200"
                 type="email" name="email" >
            </div>
            <div class="my-2">
                <label for="password">Password</label>
                <input class="block w-full border-2 px-2 py-1 my-2 rounded-md outline-none border-blue-200"
                 type="password" name="password" >
            </div>
            <button class="text-white bg-green-400 w-9/12 py-3 my-4 rounded-md">Sign Up</button>
        </form>
        
    </div>
   
    
</body>
</html>
